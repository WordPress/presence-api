name: E2E

on:
  workflow_call:
    inputs:
      should-run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Each Playwright project boots only its own wp-env instance, so neither
  # waits on the other.
  playwright:
    if: ${{ inputs.should-run }}
    name: Playwright (${{ matrix.project }}${{ matrix.shard && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two shards, since the whole suite outlasted every other leg's entire job.
          - project: chromium
            shard: 1
            shards: 2
            browser: chromium
            start: npx wp-env start
            env-dir: .
            log-container: tests-cli
          - project: chromium
            shard: 2
            shards: 2
            browser: chromium
            start: npx wp-env start
            env-dir: .
            log-container: tests-cli
          # A second instance rather than a flag on the first one, for the
          # reason given in scripts/start-multisite-env.sh. This one seeds its
          # fixture network too.
          - project: chromium-multisite
            browser: chromium
            start: npm run env:start:multisite
            env-dir: tests/e2e/multisite
            log-container: cli
          # Only the specs tagged for each engine run here, so these legs stay
          # short enough to run on every pull request.
          - project: firefox
            browser: firefox
            start: npx wp-env start
            env-dir: .
            log-container: tests-cli
          - project: webkit
            browser: webkit
            start: npx wp-env start
            env-dir: .
            log-container: tests-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # The browser is in the key so a leg never restores another leg's
      # browser and skips installing its own.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-${{ matrix.browser }}-

      # The Ubuntu mirror throttles the packages install-deps downloads often
      # enough to stall a job for minutes, so they are cached the way Gutenberg's
      # .github/setup-playwright action caches them.
      - name: Prepare the package cache
        id: apt-prepare
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          VERSION="$(node -p "require('playwright/package.json').version")"
          # Packages cached under another runner image mostly miss.
          IMAGE="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          echo "PREFIX=playwright-apt--os-${RUNNER_OS}--arch-${RUNNER_ARCH}--img-${IMAGE}--pw-${VERSION}--browsers-${BROWSER}--fingerprint-" >> "$GITHUB_OUTPUT"
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages > /dev/null
          mkdir -p "$HOME/apt-cache"

      # The key carries a fingerprint of the packages, so `key` never matches on
      # its own and the prefix search restores the newest entry.
      - name: Restore the cached packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-prepare.outputs.PREFIX }}
          restore-keys: ${{ steps.apt-prepare.outputs.PREFIX }}

      - name: Install Playwright system dependencies
        id: apt-install
        timeout-minutes: 5
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          fingerprint() {
            find "$HOME/apt-cache" -maxdepth 1 -name '*.deb' -printf '%f\n' | LC_ALL=C sort | sha256sum | cut -c1-16
          }
          BEFORE="$(fingerprint)"

          # apt re-downloads any package whose size does not match its index, so
          # a stale one here is never used.
          sudo cp -r --update=none "$HOME/apt-cache/." /var/cache/apt/archives/

          npx playwright install-deps "$BROWSER"

          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp --update=none -t "$HOME/apt-cache" {} +
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-cache"

          AFTER="$(fingerprint)"
          echo "FINGERPRINT=$AFTER" >> "$GITHUB_OUTPUT"
          echo "CHANGED=$( [ "$BEFORE" != "$AFTER" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Save the packages
        if: ${{ steps.apt-install.outputs.CHANGED == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-prepare.outputs.PREFIX }}${{ steps.apt-install.outputs.FINGERPRINT }}

      - run: npx playwright install "$BROWSER"
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        env:
          BROWSER: ${{ matrix.browser }}

      # The Playwright config declares a `webServer` that would start wp-env on
      # demand, but starting it here keeps a boot failure in its own step
      # instead of buried in Playwright's server output. `reuseExistingServer`
      # is true, so Playwright attaches to this instance rather than a second.
      - run: ${{ matrix.start }}

      - run: npm run test:e2e -- --project "$PROJECT" ${SHARD:+--shard="$SHARD/$SHARDS"}
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}

      # Screenshots are produced on success too, which is the point of keeping
      # presence-screenshots.test.js in the run: the plugin is UI-heavy and the
      # images give reviewers a look at the admin bar and widgets per PR.
      # `artifacts/storage-states/` is excluded because it holds a session cookie.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-artifacts-${{ matrix.project }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: |
            artifacts/screenshots/
            artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # wp-env selects an instance by the directory it runs in, so the network's
      # log is only reachable from the directory holding its config.
      - name: WordPress debug log
        if: ${{ failure() }}
        working-directory: ${{ matrix.env-dir }}
        run: npx wp-env run ${{ matrix.log-container }} -- cat wp-content/debug.log || true

  # Reports the `e2e / Playwright` check the `main` ruleset requires. Without
  # `!cancelled()` a failed leg would skip this job, and a skipped check passes.
  e2e:
    if: ${{ inputs.should-run && !cancelled() }}
    name: Playwright
    needs: playwright
    runs-on: ubuntu-24.04
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.playwright.result }}
