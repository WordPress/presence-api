name: PHPCS

on:
  workflow_call:
    inputs:
      should-run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  phpcs:
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check debug-tool exclusion lists stay in sync
        run: bash scripts/check-debug-exclusions.sh
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
      - name: Check features add no private calls
        run: php scripts/check-private-calls.php
      - name: Check docs/reference.md matches the docblocks
        run: php scripts/build-reference.php --check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json') }}
      - run: composer install --no-interaction
      - run: ./vendor/bin/phpcs --standard=phpcs.xml.dist
