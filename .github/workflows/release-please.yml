name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a run in flight. This workflow tags, uploads release assets, and
# commits to the WordPress.org SVN repo, so a cancelled run leaves the release
# half-finished. Release 0.1.10 shipped to GitHub but never reached .org because
# a burst of Dependabot merges cancelled its deploy job. A superseded run costs
# a few minutes; a cancelled one costs a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs: ${{ steps.release.outputs.prs }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      releases: ${{ toJSON(steps.release.outputs) }}
    steps:
      # The default GITHUB_TOKEN cannot open pull requests when the org/repo
      # setting "Allow GitHub Actions to create and approve pull requests" is
      # disabled (and it's locked at the org level here). Authenticate with a
      # PAT or GitHub App token stored in the RELEASE_PLEASE_TOKEN secret so
      # the release PR can be created.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # release-please only updates the manifest and CHANGELOG. Every place
  # WordPress (or WordPress.org) reads the version verbatim — each plugin
  # header's `* Version:`, the `WP_PRESENCE_VERSION` define, and readme.txt's
  # `Stable tag:` — is synced by `scripts/sync-versions.sh`. The script is
  # the same one a maintainer runs locally, so the CI behavior is grep-able.
  sync-versions:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs }}
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.release-please.outputs.prs) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.pr.headBranchName }}
      - run: bash scripts/sync-versions.sh
      # Regenerated after the version sync so the template's
      # `Project-Id-Version` names the release it ships in.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: ${{ endsWith(matrix.pr.headBranchName, '--components--presence-api') }}
        with:
          php-version: '8.3'
          tools: wp-cli
      - name: Regenerate the translation template
        if: ${{ endsWith(matrix.pr.headBranchName, '--components--presence-api') }}
        run: bash scripts/make-pot.sh
      - name: Sync contributors from release props
        if: ${{ endsWith(matrix.pr.headBranchName, '--components--presence-api') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr.number }}
        run: node .github/scripts/sync-contributors.js plugins/presence-api/readme.txt
      # Pushed with the same token release-please uses. A commit pushed under
      # GITHUB_TOKEN leaves the PR's head build stuck at `action_required`, so
      # the release PR never gets a Playground preview of what is shipping.
      - name: Commit synced versions back to the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore: sync versions and remove duplicate changelog entries"
            gh auth setup-git
            git push
          fi

  # Aggregate props from all PRs merged since the last published release and
  # post a single sticky comment on the open release PR.
  #
  # This runs on every push to main, not only when release-please reports a PR.
  # release-please reports one only on runs where it touched the PR, so gating
  # on that output drops anyone who merged after the last touch. The script
  # finds the open release PR itself when the output is absent.
  aggregate-props:
    needs: release-please
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROPS_SORT_LAST: ${{ vars.PROPS_SORT_LAST }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/aggregate-props.js`);
            await run({ github, context, core });

  # Zip each released plugin onto its GitHub Release, reading Presence API from
  # `plugins/presence-api` because its package path is the root `.`.
  build-release-asset:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-dev --no-interaction --optimize-autoloader
      - name: Resolve the plugin and its tag
        id: plugin
        env:
          RELEASE_PATH: ${{ matrix.path }}
          RELEASES: ${{ needs.release-please.outputs.releases }}
        run: |
          if [ "$RELEASE_PATH" = . ]; then
            dir=plugins/presence-api
            key=tag_name
          else
            dir=$RELEASE_PATH
            key="$RELEASE_PATH--tag_name"
          fi
          {
            echo "dir=$dir"
            echo "slug=${dir##*/}"
            echo "tag=$(jq -r --arg key "$key" '.[$key]' <<< "$RELEASES")"
          } >> "$GITHUB_OUTPUT"
      - name: Build plugin zip
        env:
          DIR: ${{ steps.plugin.outputs.dir }}
          SLUG: ${{ steps.plugin.outputs.slug }}
        run: |
          mkdir -p "build/$SLUG"
          rsync -a --exclude-from="$DIR/.distignore" "$DIR/" "build/$SLUG/"
          cp LICENSE "build/$SLUG/"
          cd build && zip -r "$SLUG.zip" "$SLUG/"
      - run: gh release upload --clobber "$TAG" "build/$SLUG.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plugin.outputs.tag }}
          SLUG: ${{ steps.plugin.outputs.slug }}

  deploy-to-wporg:
    needs: [release-please, build-release-asset]
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-wporg.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
      WPORG_SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
