name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # The default GITHUB_TOKEN cannot open pull requests when the org/repo
      # setting "Allow GitHub Actions to create and approve pull requests" is
      # disabled (and it's locked at the org level here). Authenticate with a
      # PAT or GitHub App token stored in the RELEASE_PLEASE_TOKEN secret so
      # the release PR can be created.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # release-please only updates the manifest and CHANGELOG. Every place
  # WordPress (or WordPress.org) reads the version verbatim — the plugin
  # header `* Version:`, the `WP_PRESENCE_VERSION` define, and readme.txt's
  # `Stable tag:` — is synced by `scripts/sync-versions.sh`. The script is
  # the same one a maintainer runs locally, so the CI behavior is grep-able.
  sync-versions:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - run: bash scripts/sync-versions.sh
      - name: Commit synced versions back to the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add presence-api.php readme.txt
            git commit -m "chore: sync versions across plugin file and readme"
            gh auth setup-git
            git push
          fi

  # When a release PR is created or updated, aggregate props from all PRs
  # merged since the last published release and post a single sticky comment.
  aggregate-props:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PROPS_SORT_LAST: ${{ vars.PROPS_SORT_LAST }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/aggregate-props.js`);
            await run({ github, context, core });

  # When release-please's PR is merged, it tags + cuts the GitHub Release.
  # Build the distribution zip and attach it to the release.
  build-release-asset:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-dev --no-interaction --optimize-autoloader
      - name: Build plugin zip
        run: |
          mkdir -p build/presence-api
          rsync -a --exclude-from='.distignore' ./ build/presence-api/
          cd build && zip -r presence-api.zip presence-api/
      - run: gh release upload --clobber "${{ needs.release-please.outputs.tag_name }}" build/presence-api.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-wporg:
    needs: [release-please, build-release-asset]
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/deploy-wporg.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
      WPORG_SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
