name: Release Please

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # The default GITHUB_TOKEN cannot open pull requests when the org/repo
      # setting "Allow GitHub Actions to create and approve pull requests" is
      # disabled (and it's locked at the org level here). Authenticate with a
      # PAT or GitHub App token stored in the RELEASE_PLEASE_TOKEN secret so
      # the release PR can be created.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # release-please only updates the manifest and CHANGELOG. Every place
  # WordPress (or WordPress.org) reads the version verbatim — the plugin
  # header `* Version:`, the `WP_PRESENCE_VERSION` define, and readme.txt's
  # `Stable tag:` — is synced by `scripts/sync-versions.sh`. The script is
  # the same one a maintainer runs locally, so the CI behavior is grep-able.
  sync-versions:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - run: bash scripts/sync-versions.sh
      - name: Commit synced versions back to the release PR
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add presence-api.php readme.txt
            git commit -m "chore: sync versions across plugin file and readme"
            git push
          fi

  # Close issues that were fixed in this release and leave a comment with a
  # Playground link so reporters can verify the fix without a local install.
  close-issues:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Close issues fixed in this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v '^preview-' | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — skipping."
            exit 0
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          PLAYGROUND_URL="https://playground.wordpress.net/?blueprint-url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/blueprint.json"

          CLOSED=()
          PR_NUMBERS=$(git log "${PREV_TAG}..${TAG}" --pretty=format:"%s" \
            | grep -oE 'Merge pull request #[0-9]+' \
            | grep -oE '[0-9]+$')

          for PR in $PR_NUMBERS; do
            BODY=$(gh pr view "$PR" --json body --jq '.body // ""' 2>/dev/null || true)
            ISSUES=$(echo "$BODY" | grep -oiE '(closes|fixes|resolves)[[:space:]:]+#[0-9]+' | grep -oE '[0-9]+')
            for ISSUE in $ISSUES; do
              if printf '%s\n' "${CLOSED[@]:-}" | grep -qx "$ISSUE"; then continue; fi
              CLOSED+=("$ISSUE")
              gh issue close "$ISSUE" --comment ":tada: Resolved in [**${TAG}**](${RELEASE_URL}).

**[Try it on WordPress Playground →](${PLAYGROUND_URL})**"
            done
          done

          echo "Closed: ${CLOSED[*]:-none}"

  # When release-please's PR is merged, it tags + cuts the GitHub Release.
  # Build the distribution zip and attach it to the release.
  build-release-asset:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-dev --no-interaction --optimize-autoloader
      - name: Build plugin zip
        run: |
          mkdir -p build/presence-api
          rsync -a --exclude-from='.distignore' ./ build/presence-api/
          cd build && zip -r presence-api.zip presence-api/
      - run: gh release upload --clobber "${{ needs.release-please.outputs.tag_name }}" build/presence-api.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
