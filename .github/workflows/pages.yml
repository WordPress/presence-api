name: Pages

# Publishes showcase/ to https://wordpress.github.io/presence-api/, with the
# plugin's .org screenshots copied in rather than kept twice in the repo.

on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'plugins/presence-api/.wordpress-org/*.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Queued, not cancelled, so a deploy in progress always finishes.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: npm run build:showcase

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/showcase

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
