name: Pages

# Publishes showcase/ to https://wordpress.github.io/presence-api/, with the
# plugin's .org screenshots copied in rather than kept twice in the repo, and
# docs/ rendered under /docs/. A pull request that touches them builds the
# site without publishing it.

on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'docs/**'
      - 'scripts/build-docs.js'
      - 'plugins/presence-api/.wordpress-org/*.png'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'showcase/**'
      - 'docs/**'
      - 'scripts/build-docs.js'
      - 'plugins/presence-api/.wordpress-org/*.png'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Queued, not cancelled, so a deploy in progress always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci

      # Draws each docs diagram as a static SVG.
      - run: npx playwright install --with-deps chromium

      - run: npm run build:showcase

      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/showcase

  deploy:
    name: Deploy
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
