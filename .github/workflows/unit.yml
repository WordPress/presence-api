name: Unit Tests

on:
  workflow_call:
    inputs:
      should-run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit:
    if: ${{ inputs.should-run }}
    # Runs Vitest, but the `main` ruleset requires `unit / Jest`; rename both together.
    name: Jest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
