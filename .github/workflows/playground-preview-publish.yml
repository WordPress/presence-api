name: Playground Preview Publish

# Runs in the base-repo context (via `workflow_run`) so it has write
# access even for PRs from forks. Downloads the build artifacts from
# the triggering workflow, pushes them to a per-PR `preview-pr-N`
# branch that raw.githubusercontent.com can serve to the browser, and
# posts (or updates) the sticky Playground comment on the PR.
#
# Security model: every PR-derived input is untrusted.
#   - `pr-meta.json` is parsed with jq and regex-validated; we never
#     `source` it as shell.
#   - The blueprint templates we encode into Playground URLs come from
#     the base ref (this checkout), not from the PR. Only the asset URLs
#     are rewritten in, and every one points at ${{ github.repository }},
#     so a fork PR cannot redirect Playground.
#   - Nothing reads `preview-pr-*`, so the branch is never executed.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Playground Preview"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts from the triggering run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const list = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            for (const name of ['release-assets', 'pr-meta']) {
              const found = list.data.artifacts.find(a => a.name === name);
              if (!found) {
                core.setFailed(`Required artifact "${name}" not found on workflow run.`);
                return;
              }
              const dl = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: found.id,
                archive_format: 'zip',
              });
              fs.writeFileSync(`${name}.zip`, Buffer.from(dl.data));
            }

      - name: Unpack and validate artifacts
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The build runs untrusted PR code; the run's head SHA is the only
          # trusted value.
          TRUSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-assets artifacts/pr-meta
          unzip -q -o -d artifacts/release-assets release-assets.zip
          unzip -q -o -d artifacts/pr-meta pr-meta.zip
          test -f artifacts/release-assets/presence-api.zip
          test -f artifacts/release-assets/demo-seeder.php
          test -f artifacts/release-assets/screen-stale-demo-helper.php
          test -f artifacts/pr-meta/pr-meta.json

          # Parse with jq and validate types. Never `source` the artifact.
          META_HEAD_SHA=$(jq -r '.head_sha' artifacts/pr-meta/pr-meta.json)
          [[ "$META_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "Invalid SHA in pr-meta: $META_HEAD_SHA"; exit 1; }

          # Require pr-meta's SHA to match the triggering run.
          if [[ "$META_HEAD_SHA" != "$TRUSTED_HEAD_SHA" ]]; then
            echo "Refusing to publish: pr-meta head SHA ($META_HEAD_SHA) does not match the triggering run ($TRUSTED_HEAD_SHA)."
            exit 1
          fi

          # Resolve the PR number from the trusted head SHA rather than the
          # artifact-supplied value.
          readarray -t _prs < <(
            gh api "repos/${GH_REPO}/pulls?state=open&per_page=100" --paginate \
              --jq '.[] | select(.head.sha == env.TRUSTED_HEAD_SHA) | .number'
          )
          PR_NUMBER="${_prs[0]:-}"

          # A merged or superseded head has no comment left to post, and the push
          # that superseded it is already building a preview of its own.
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::notice::No open pull request at head SHA $TRUSTED_HEAD_SHA; nothing to publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "PR_NUMBER=$PR_NUMBER"
            echo "HEAD_SHA=$TRUSTED_HEAD_SHA"
          } >> "$GITHUB_ENV"

      # Playground fetches these from the browser. Release assets send no
      # `Access-Control-Allow-Origin`; raw.githubusercontent.com does.
      - name: Publish preview assets
        if: ${{ steps.meta.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="preview-pr-${PR_NUMBER}"

          # Force-pushed from a throwaway repo, so no preview blob reaches the
          # history everyone clones. The SHA is a path component because raw
          # caches by path.
          mkdir -p "preview/${HEAD_SHA}"
          cp artifacts/release-assets/* "preview/${HEAD_SHA}/"

          cd preview
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Playground preview for PR #${PR_NUMBER} at ${HEAD_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$BRANCH"

      - name: Assemble Playground URLs from base-ref blueprints
        id: playground
        if: ${{ steps.meta.outputs.skipped != 'true' }}
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Always the base repository, never the PR's head repository.
          RAW="https://raw.githubusercontent.com/${REPO}/preview-pr-${PR_NUMBER}/${HEAD_SHA}"
          PLUGIN_URL="${RAW}/presence-api.zip"
          SEEDER_URL="${RAW}/demo-seeder.php"
          HELPER_URL="${RAW}/screen-stale-demo-helper.php"

          # raw's CDN can lag the push by a few seconds.
          for _ in $(seq 30); do
            if curl -sf -o /dev/null "$PLUGIN_URL"; then
              break
            fi
            sleep 2
          done
          curl -sf -o /dev/null "$PLUGIN_URL" \
            || { echo "Preview assets never appeared at $PLUGIN_URL"; exit 1; }

          # writeFile steps are matched by trailing path component so the
          # seeder and helper get distinct URLs without depending on the
          # order they appear in the blueprint.
          transform() {
            jq --arg plugin "$1" --arg seeder "$2" --arg helper "$3" '
              .steps |= map(
                if .step == "installPlugin" and (.pluginData.resource == "url") then
                  .pluginData.url = $plugin
                elif .step == "writeFile" and (.data.resource == "url") then
                  if (.path | endswith("/demo-seeder.php")) then .data.url = $seeder
                  elif (.path | endswith("/screen-stale-demo-helper.php")) then .data.url = $helper
                  else . end
                else . end
              )
            ' "$4"
          }

          BLUEPRINT=$(transform "$PLUGIN_URL" "$SEEDER_URL" "$HELPER_URL" blueprint.json)
          BLUEPRINT_40=$(transform "$PLUGIN_URL" "$SEEDER_URL" "$HELPER_URL" blueprint-40.json)
          BLUEPRINT_MS=$(transform "$PLUGIN_URL" "$SEEDER_URL" "$HELPER_URL" blueprint-multisite.json)
          BLUEPRINT_MS40=$(transform "$PLUGIN_URL" "$SEEDER_URL" "$HELPER_URL" blueprint-multisite-40.json)

          encode() { printf '%s' "$1" | base64 -w0; }

          {
            echo "url=https://playground.wordpress.net/#$(encode "$BLUEPRINT")"
            echo "url_40=https://playground.wordpress.net/#$(encode "$BLUEPRINT_40")"
            echo "url_multisite=https://playground.wordpress.net/#$(encode "$BLUEPRINT_MS")"
            echo "url_multisite_40=https://playground.wordpress.net/#$(encode "$BLUEPRINT_MS40")"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update sticky comment
        if: ${{ steps.meta.outputs.skipped != 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          PLAYGROUND_URL: ${{ steps.playground.outputs.url }}
          PLAYGROUND_URL_40: ${{ steps.playground.outputs.url_40 }}
          PLAYGROUND_URL_MULTISITE: ${{ steps.playground.outputs.url_multisite }}
          PLAYGROUND_URL_MULTISITE_40: ${{ steps.playground.outputs.url_multisite_40 }}
        with:
          script: |
            const marker = '<!-- presence-api:playground-preview -->';
            const url = process.env.PLAYGROUND_URL;
            const url40 = process.env.PLAYGROUND_URL_40;
            const urlMultisite = process.env.PLAYGROUND_URL_MULTISITE;
            const urlMultisite40 = process.env.PLAYGROUND_URL_MULTISITE_40;
            const fullSha = process.env.HEAD_SHA;
            const sha = fullSha.slice(0, 7);
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${fullSha}`;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const badge = 'https://img.shields.io/badge/Launch-3858E9?style=for-the-badge&logo=wordpress&logoColor=white';

            // GitHub renders the first column as plain cells, so a table gives a
            // screen reader no row header; each link's alt text has to stand alone.
            const launch = (href, label) => `[![${label}](${badge})](${href})`;

            const body = [
              marker,
              '### 🛝 WordPress Playgrounds',
              '',
              // Below the heading so the sha keeps body weight, and in <samp>
              // because GitHub chips `code` and the `tt` its own autolinker
              // emits, which the timeline's sha links are not.
              `Built from <a href="${commitUrl}"><samp>${sha}</samp></a>`,
              '',
              '|  | 5 users | 40 users |',
              '| --- | --- | --- |',
              `| **Single site** | ${launch(url, 'Launch single site, 5 users')} | ${launch(url40, 'Launch single site, 40 users')} |`,
              `| **Multisite** | ${launch(urlMultisite, 'Launch multisite, 5 users')} | ${launch(urlMultisite40, 'Launch multisite, 40 users')} |`,
              '',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
