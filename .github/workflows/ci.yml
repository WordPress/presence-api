name: CI

on:
  push:
    branches: [ main ]
  # Unfiltered on purpose. A pull request in a stack is based on its parent
  # branch rather than main, and `branches: [ main ]` skips it entirely, so
  # every pull request below the top of a stack would merge unverified.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !startsWith(github.ref, 'refs/heads/release-please--') }}
    steps:
      - run: true

  phpcs:
    needs: gate
    uses: ./.github/workflows/phpcs.yml

  phpstan:
    needs: gate
    uses: ./.github/workflows/phpstan.yml

  phpunit:
    needs: gate
    uses: ./.github/workflows/phpunit.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    needs: gate
    uses: ./.github/workflows/e2e.yml

  plugin-check:
    needs: gate
    uses: ./.github/workflows/plugin-check.yml

  typos:
    needs: gate
    uses: ./.github/workflows/typos.yml
