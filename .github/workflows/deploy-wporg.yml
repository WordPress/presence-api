name: Deploy to WordPress.org

on:
  workflow_call:
    inputs:
      tag:
        type: string
        description: 'Git tag to deploy (e.g. v0.1.4)'
        required: false
      dry-run:
        type: boolean
        default: false
    secrets:
      WPORG_SVN_PASSWORD:
        required: true
      WPORG_SVN_USERNAME:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 'Git tag to deploy (e.g. v0.1.4)'
        required: true
      dry-run:
        type: boolean
        description: 'Dry run (deploy without publishing to WordPress.org).'
        default: false

# Disable permissions for all available scopes.
# The deploy job only needs read access to clone the repo.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve inputs
        id: inputs
        run: |
          TAG="$(echo "${{ inputs.tag }}" | xargs)"
          if [ -n "$TAG" ]; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.inputs.outputs.ref }}
      - name: Deploy to WordPress.org Plugin Directory
        # To add banner/icon assets later, place them in .wordpress-org/ and
        # the action will sync them to the SVN assets/ directory automatically.
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
        with:
          dry-run: ${{ inputs.dry-run || false }}
        env:
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SLUG: presence-api
          VERSION: ${{ steps.inputs.outputs.version }}
