name: Playground Preview

# Builds `presence-api.zip` from the PR commit and uploads it (plus the
# demo seeder and helper) as a workflow artifact. The sibling
# `Playground Preview Publish` workflow picks the artifact up on
# `workflow_run` and hosts it, so a preview always shows the PR's own
# build at its latest commit.
#
# Release-please PRs included: nothing else verifies the staged version.

on:
  pull_request:
    # Skip the obvious non-shippable surface. Docs, CI, tests — none of
    # them change what a reviewer sees when they open the Playground
    # link. A demo-seeder or workflow-only PR can fire the preview by
    # hand via `workflow_dispatch` when there's a real need.
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'tests/**'
      - 'plugins/presence-api/tests/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. The build runs PR code, so it must be treated as
# untrusted. Hosting and commenting happen in the sibling workflow_run
# job under a base-repo token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer

      # The PR controls this job; `--no-scripts` is not a boundary, the read-only token is.
      - run: composer install --no-dev --no-interaction --optimize-autoloader --no-scripts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

      - name: Build presence-api.zip
        run: |
          set -euo pipefail
          mkdir -p build/presence-api
          rsync -a --exclude-from='plugins/presence-api/.distignore' plugins/presence-api/ build/presence-api/
          cp LICENSE build/presence-api/
          (cd build && zip -qr presence-api.zip presence-api/)

      - name: Build presence-debugger.zip
        run: |
          set -euo pipefail
          mkdir -p build/presence-debugger
          rsync -a --exclude-from='plugins/presence-debugger/.distignore' plugins/presence-debugger/ build/presence-debugger/
          cp LICENSE build/presence-debugger/
          (cd build && zip -qr presence-debugger.zip presence-debugger/)

      # Cheap smoke test: parse every PHP file in the staged plugin and
      # confirm the entry file is present. Catches the regression class
      # where `.distignore` drifts out of sync with `require_once`
      # graphs — install succeeds but the plugin fatals on first hit.
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/presence-api/presence-api.php
          test -f build/presence-debugger/load.php
          find build/presence-api build/presence-debugger -name '*.php' -print0 \
            | xargs -0 -n1 -P 4 php -l > /dev/null

      # Asserts each blueprint matches the shape the publish workflow
      # rewrites — exactly one URL-resource `installPlugin` each of
      # presence-api and presence-debugger, two URL-resource `writeFile`s,
      # and only the step types we expect. The one other plugin a blueprint
      # may install is the GSE release.
      # Fork PRs can't sneak in additional `installPlugin` steps that
      # pull from attacker URLs because the publish workflow uses the
      # BASE-REF blueprints, but this still catches accidental breakage.
      - name: Schema-validate blueprints
        run: |
          set -euo pipefail
          for f in blueprint.json blueprint-multisite.json blueprint-rtc.json blueprint-multisite-rtc.json; do
            # This step is the base's, the checkout is the PR's head.
            if [ ! -f "$f" ]; then
              echo "::notice::$f is not on this branch, so nothing to validate."
              continue
            fi
            jq -e '
              (.steps | length > 0)
              and (.steps | all(.step | IN("defineWpConfigConsts", "installPlugin", "writeFile", "runPHP", "enableMultisite", "wp-cli")))
              and (.steps | map(select(.step == "installPlugin" and (.pluginData.resource // "") == "url" and (.pluginData.url | endswith("/presence-api.zip")))) | length == 1)
              and (.steps | map(select(.step == "installPlugin" and (.pluginData.resource // "") == "url" and (.pluginData.url | endswith("/presence-debugger.zip")))) | length == 1)
              and (.steps | map(select(.step == "installPlugin" and ((.pluginData.resource // "") != "url" or ((.pluginData.url | endswith("/presence-api.zip") | not) and (.pluginData.url | endswith("/presence-debugger.zip") | not))))) | all(.pluginData.url == "https://github.com/WordPress/gutenberg-sync-engines/releases/latest/download/gutenberg-sync-engines.zip"))
              and (.steps | map(select(.step == "writeFile" and (.data.resource // "") == "url")) | length == 2)
            ' "$f" > /dev/null
          done

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/presence-api.zip release-assets/
          cp build/presence-debugger.zip release-assets/
          cp tests/e2e/demo-seeder.php release-assets/
          cp tests/e2e/screen-stale-demo-helper.php release-assets/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          retention-days: 14
          if-no-files-found: error
