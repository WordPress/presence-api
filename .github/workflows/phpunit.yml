name: PHPUnit

on:
  workflow_call:
    inputs:
      should-run:
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]
        include:
          - php: '8.3'
            coverage: true
    steps:
      # A job-level `if:` would skip before the matrix expands, collapsing
      # both PHP versions into one unexpanded `phpunit / PHP ${{ matrix.php
      # }}` check instead of the two named ones required checks expect. Every
      # step below is gated instead, so the matrix still expands and the job
      # reports success under each version's own name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.should-run }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ inputs.should-run }}
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: ${{ inputs.should-run }}
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: npm ci
        if: ${{ inputs.should-run }}
      - name: Authenticate composer to GitHub
        if: ${{ inputs.should-run }}
        run: composer config --global --auth github-oauth.github.com '${{ secrets.GITHUB_TOKEN }}'
      - name: Install Composer dependencies
        if: ${{ inputs.should-run }}
        run: composer install --no-interaction
      - name: Start wp-env (retry on transient PECL download failures)
        if: ${{ inputs.should-run }}
        run: |
          for attempt in 1 2 3; do
            if npx wp-env start ${{ matrix.coverage && '--xdebug=coverage' || '' }}; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            npx wp-env destroy || true
            echo "wp-env start failed on attempt $attempt, retrying..."
          done
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
      - run: npx wp-env run tests-cli --env-cwd='wp-content/plugins/presence-api' -- ./vendor/bin/phpunit ${{ matrix.coverage && '--coverage-clover coverage.xml' || '' }}
        if: ${{ inputs.should-run }}
      - name: Upload coverage to Codecov
        if: ${{ inputs.should-run && matrix.coverage }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: phpunit
      # This is the only multisite run in CI. It lives here rather than in its
      # own workflow because the run above skips every is_multisite() test, so
      # the network provisioning paths in presence-api.php reported as uncovered
      # no matter how well tested they were. Reusing this job's environment
      # costs seconds, and Codecov merges the two reports for the commit.
      #
      # Keep the multisite suite running if this job's coverage matrix ever
      # changes, otherwise network behaviour stops being tested at all.
      #
      # WP_MULTISITE=1 is what puts the test bootstrap into network mode. The
      # bootstrap installs its own test database and never reads wp-config.php,
      # so no `multisite-convert` is needed here. Without the variable the suite
      # prints "Running as single site..." and this report adds nothing.
      - name: Run the suite as multisite
        if: ${{ inputs.should-run && matrix.coverage }}
        run: npx wp-env run tests-cli --env-cwd='wp-content/plugins/presence-api' -- env WP_MULTISITE=1 ./vendor/bin/phpunit --coverage-clover coverage-multisite.xml
      - name: Upload multisite coverage to Codecov
        if: ${{ inputs.should-run && matrix.coverage }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-multisite.xml
          flags: multisite
