name: Set up Node.js
description: Installs Node.js and restores node_modules for the lockfile, running npm ci only when no cache matches.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    # Install scripts write native binaries into node_modules, so the key carries everything they depend on.
    - name: Cache node_modules
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node-22-modules-${{ hashFiles('package-lock.json') }}

    - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      run: npm ci
      shell: bash
