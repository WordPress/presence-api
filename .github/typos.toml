[default.extend-words]
# "Who's Online" widget -- "whos" is used intentionally throughout class names,
# CSS IDs, and hook names (e.g. WP_Presence_Widget_Whos_Online, #presence-whos-online-list).
whos = "whos"
# WordPress Core function: get_post_stati() is the official plural form.
stati = "stati"

[files]
# Auto-generated by release-please; contains git commit SHAs that trigger false positives.
extend-exclude = ["CHANGELOG.md"]
