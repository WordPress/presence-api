name: Enhancement
description: A suggestion for improvement of an existing feature.
labels: ["[Type] Enhancement", "Needs Dev"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.

        This plugin is a proposal for WordPress core, so changes are weighed against core patterns and backward compatibility. Broader design conversation belongs on [Make Core](https://make.wordpress.org/core/?s=presence-api) under the `#presence-api` tag.

        If you are using AI tooling to help write this issue, you must disclose it in the last field. See the [WordPress AI Guidelines](https://make.wordpress.org/ai/handbook/ai-guidelines/).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult, slow, or impossible today? Describe the situation rather than the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: How might this be addressed? A rough direction is fine; it does not need to be a finished design.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the plugin does this affect? A maintainer will apply the matching `[Area]` label.
      options:
        - Not sure
        - Heartbeat
        - REST API
        - Widgets
        - Admin UI
        - Post Lock Bridge
        - CLI
        - Database
    validations:
      required: true

  - type: textarea
    id: ai
    attributes:
      label: Use of AI Tools
      description: Required. If you did not use AI tooling, set "AI assistance" to No and leave the rest blank.
      value: |
        AI assistance: No
        Tool(s):
        Model(s):
        Used for:
    validations:
      required: true
