name: Enhancement
description: Something that works but could work better.
labels: ['[Type] Enhancement']
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: How it works today, and what that costs.
    validations:
      required: true
  - type: textarea
    id: what-should-change
    attributes:
      label: What should change
  - type: textarea
    id: done
    attributes:
      label: How we will know it is done
