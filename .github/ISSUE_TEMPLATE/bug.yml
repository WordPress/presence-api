name: Bug
description: Something in the plugin does not work as it should.
labels: ['[Type] Bug']
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you did and what you saw. Steps, versions, or a screenshot all help.
    validations:
      required: true
  - type: textarea
    id: what-should-change
    attributes:
      label: What should change
  - type: textarea
    id: done
    attributes:
      label: How we will know it is done
