comment:
  layout: "condensed_header, diff, flags, components"
  require_changes: true

coverage:
  status:
    # Ratchet: each PR must not drop overall coverage by more than the
    # threshold. `auto` compares against the base commit rather than a fixed
    # number, so the floor rises as coverage improves.
    project:
      default:
        target: auto
        threshold: 1%
    # New and changed lines are held to a fixed bar, independent of the
    # project total. This is what keeps untested code from landing while the
    # overall figure is still climbing.
    #
    # Reporting only for now. Four files are still at 0% (cli, post-list,
    # user-list, cron), so any PR touching them would fail this gate before
    # the tests that would satisfy it exist. Drop `informational` once those
    # are covered, to make it blocking.
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: true

# Files excluded here are also excluded from PHPUnit's coverage measurement in
# phpunit.xml.dist and from the distributed zip in .distignore. All three lists
# are checked for agreement by scripts/check-debug-exclusions.sh in CI.
ignore:
  # WP_DEBUG-only developer tools, not part of the distributed zip (.distignore).
  - "includes/db-viewer.php"
  - "includes/debugger-widget.php"
  - "tests/**"
  - "assets/**"
  - "blueprint.json"
